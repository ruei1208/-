<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>TRWP Showreel v3</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #000; color: #e9f0ec; font: 13px/1.4 "JetBrains Mono", monospace; }
  canvas { width: 100vw; max-width: 100%; aspect-ratio: 16/9; display: block; }
  #ui { position: fixed; left: 8px; bottom: 8px; background: #000a; padding: 6px 10px; border-radius: 6px; white-space: pre; }
  button { font: inherit; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui">loading…</div>
<script type="module">
import { W, H, FPS, DUR, loadAssets, composite, drawFrame } from './app.js';
import { renderMusic, SR } from './music.js';

const q = new URLSearchParams(location.search);
const c = document.getElementById('c'), ctx = c.getContext('2d');
const ui = document.getElementById('ui');
const log = s => { ui.textContent = s; console.log(s); };
const tick = () => new Promise(r => setTimeout(r, 0));

// make sure every glyph we draw is loaded before the first frame
const src = await (await fetch('app.js')).text();
const glyphs = [...new Set(src.match(/[^\x00-\x7F]/g))].join('') + 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789%+-=/.·×≈→';
await Promise.all([
  ...[700, 900].map(w => document.fonts.load(`${w} 40px "Noto Serif TC"`, glyphs)),
  ...[500, 600].map(w => document.fonts.load(`${w} 40px "IBM Plex Mono"`, glyphs)),
  document.fonts.load(`500 40px "Noto Sans TC"`, glyphs),
]);
await document.fonts.ready;
await loadAssets();
window.renderAt = t => composite(ctx, t);
window.ready = true;
log('ready');

if (q.has('t')) { composite(ctx, +q.get('t')); log('t=' + q.get('t')); }

if (q.has('sheet')) {
  const times = q.get('sheet').split(',').map(Number), cols = +(q.get('cols') || 4), cw = W / cols, ch = cw * 9 / 16;
  const off = document.createElement('canvas'); off.width = W; off.height = H; const octx = off.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  times.forEach((t, i) => { composite(octx, t); const x = (i % cols) * cw, y = Math.floor(i / cols) * ch; ctx.drawImage(off, x, y, cw, ch);
    ctx.fillStyle = '#000c'; ctx.fillRect(x, y, 90, 26); ctx.fillStyle = '#fff'; ctx.font = '600 18px monospace'; ctx.fillText(t.toFixed(2), x + 6, y + 19);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(x, y, cw, ch); });
  log('sheet ' + times.join(','));
}

function wav(buf) {
  const n = buf.length, ch = buf.numberOfChannels, out = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const w = (o, s) => [...s].forEach((c2, i) => out.setUint8(o + i, c2.charCodeAt(0)));
  w(0, 'RIFF'); out.setUint32(4, 36 + n * ch * 2, true); w(8, 'WAVEfmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
  out.setUint32(24, buf.sampleRate, true); out.setUint32(28, buf.sampleRate * ch * 2, true); out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, n * ch * 2, true);
  const d = [...Array(ch)].map((_, i) => buf.getChannelData(i)); let o = 44;
  for (let i = 0; i < n; i++) for (let k = 0; k < ch; k++) { const s = Math.max(-1, Math.min(1, d[k][i])); out.setInt16(o, s * 32767, true); o += 2; }
  return out.buffer;
}
function stats(buf) {
  const L = buf.getChannelData(0), R = buf.getChannelData(1); let peak = 0; const rms = [];
  for (let s = 0; s < 30; s++) { let acc = 0; for (let i = s * SR; i < (s + 1) * SR; i++) { const v = (L[i] + R[i]) / 2; acc += v * v; peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i])); } rms.push((20 * Math.log10(Math.sqrt(acc / SR) + 1e-9)).toFixed(1)); }
  return { peak: peak.toFixed(3), rmsPerSecond: rms.join(' ') };
}

if (q.has('music')) {
  log('rendering music…'); const buf = await renderMusic(); window.musicStats = stats(buf);
  await fetch('/save/TRWP_score_v3.wav', { method: 'POST', body: wav(buf) }); log('music saved ' + JSON.stringify(window.musicStats));
}

if (q.has('play')) {
  const buf = await renderMusic(); log('click to play');
  const go = () => { const ac = new AudioContext(); const s = ac.createBufferSource(); s.buffer = buf; s.connect(ac.destination); const t0 = ac.currentTime + 0.1; s.start(t0);
    const loop = () => { const t = ac.currentTime - t0; if (t < DUR) { ctx.setTransform(1, 0, 0, 1, 0, 0); drawFrame(ctx, Math.max(0, t)); requestAnimationFrame(loop); } }; loop(); };
  c.addEventListener('click', go, { once: true });
}

if (q.has('export')) {
  const t0 = performance.now();
  const { Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs');
  log('rendering score…'); const audio = await renderMusic(); window.musicStats = stats(audio);
  let vcodec = null;
  for (const cand of ['avc1.640033', 'avc1.640032', 'avc1.4d0033', 'avc1.42e033']) {
    const s = await VideoEncoder.isConfigSupported({ codec: cand, width: W, height: H, bitrate: 22e6, framerate: FPS });
    if (s.supported) { vcodec = cand; break; } }
  const aacOk = (await AudioEncoder.isConfigSupported({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: 256000 })).supported;
  window.codecs = { vcodec, aacOk };
  if (!vcodec) { log('NO H.264 ENCODER'); throw new Error('no h264'); }
  const target = new ArrayBufferTarget();
  const noAudio = q.has('noaudio');
  const muxer = new Muxer({ target, video: { codec: 'avc', width: W, height: H, frameRate: FPS }, ...(noAudio ? {} : { audio: { codec: aacOk ? 'aac' : 'opus', numberOfChannels: 2, sampleRate: SR } }), fastStart: 'in-memory', firstTimestampBehavior: 'offset' });
  const ve = new VideoEncoder({ output: (ch, m) => muxer.addVideoChunk(ch, m), error: e => { window.err = String(e); log('VE ' + e); } });
  ve.configure({ codec: vcodec, width: W, height: H, bitrate: noAudio ? 40_000_000 : 22_000_000, framerate: FPS, latencyMode: 'quality', avc: { format: 'avc' } });
  const ae = new AudioEncoder({ output: (ch, m) => muxer.addAudioChunk(ch, m), error: e => { window.err = String(e); log('AE ' + e); } });
  ae.configure({ codec: aacOk ? 'mp4a.40.2' : 'opus', sampleRate: SR, numberOfChannels: 2, bitrate: 256000 });
  const Lc = audio.getChannelData(0), Rc = audio.getChannelData(1), N = Lc.length, AF = 1024;
  let ai = 0;
  const pushAudioUntil = tsec => { while (!noAudio && ai < N && ai / SR <= tsec) { const n = Math.min(AF, N - ai); const d = new Float32Array(n * 2); d.set(Lc.subarray(ai, ai + n), 0); d.set(Rc.subarray(ai, ai + n), n);
    const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(ai / SR * 1e6), data: d }); ae.encode(ad); ad.close(); ai += n; } };
  const total = DUR * FPS;
  for (let f = 0; f < total; f++) {
    composite(ctx, f / FPS);
    const vf = new VideoFrame(c, { timestamp: Math.round(f * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    ve.encode(vf, { keyFrame: f % 120 === 0 }); vf.close();
    pushAudioUntil((f + 1) / FPS);
    while (ve.encodeQueueSize > 4) await new Promise(r => setTimeout(r, 2));
    if (f % 20 === 0) { log(`frame ${f}/${total}  ${((performance.now() - t0) / 1000).toFixed(0)}s`); window.progress = f / total; await tick(); }
    if (f % 300 === 0) fetch('/save/progress.txt', { method: 'POST', body: `frame ${f}/${total} ${((performance.now() - t0) / 1000).toFixed(0)}s` });
  }
  pushAudioUntil(DUR + 1);
  await ve.flush(); await ae.flush(); muxer.finalize();
  log('uploading…');
  await fetch(noAudio ? '/save/video_only.mp4' : '/save/TRWP_showreel_v3_60s.mp4', { method: 'POST', body: target.buffer });
  await fetch('/save/TRWP_score_v3.wav', { method: 'POST', body: wav(audio) });
  window.done = true; log(`done in ${((performance.now() - t0) / 1000).toFixed(0)}s · ${vcodec} · ${aacOk ? 'aac' : 'opus'} · ${(target.buffer.byteLength / 1e6).toFixed(1)} MB`);
}
</script>
</body>
</html>
